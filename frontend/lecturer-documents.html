<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Materials</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skyblue: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#0a3751',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .glass {
            background: rgba(224, 242, 254, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

<body class="min-h-screen bg-[#bae6fd]/80 text-[#0a3751]">

    <div id="studentNavbar"></div>

    <main class="mx-auto max-w-7xl px-4 pb-12 pt-28 sm:px-6 lg:px-8">

        <!-- Hero Banner -->
        <section class="mb-8">

            <div class="rounded-3xl bg-gradient-to-r from-[#075985] via-[#0369a1] to-[#0284c7] p-6 text-white shadow-xl shadow-[#0c4a6e]/10 sm:p-8">

            <div class="flex flex-col gap-7 md:flex-row md:items-center md:justify-between">
                
                <div>
                    <div class="mb-3 flex items-center gap-2 text-base font-bold text-skyblue-100">
                        <i class="fa-solid fa-book-open"></i>
                        LEARNING MATERIALS
                    </div>
                    <h1 class="text-4xl font-extrabold tracking-tight">
                        Lecturer Materials
                    </h1>
                    <p class="mt-3 max-w-2xl text-base font-medium leading-relaxed text-skyblue-100">
                        Browse and download lecture documents shared by lecturers with your class.
                    </p>
                </div>

                
                
            </div>
        </section>

        <!-- Error -->
        <p id="documentsError" class="mb-5 text-base font-bold text-red-600"></p>

        <!-- MATERIAL GRID -->
        <div id="lecturerDocumentsBody" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>

        <!-- DOCUMENT DETAILS SECTION -->
        <section id="documentDetails" class="glass mt-8 hidden rounded-2xl border border-skyblue-300 p-6 shadow-lg">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-sm font-bold uppercase tracking-wider text-skyblue-600">Document details</p>
                    <h2 id="detailFileName" class="mt-1 text-2xl font-bold text-skyblue-900"></h2>
                </div>
                <button type="button" onclick="closeDocumentDetails()" class="flex h-10 w-10 items-center justify-center rounded-xl bg-skyblue-100 text-skyblue-700 hover:bg-skyblue-200" title="Close details" aria-label="Close details">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <dl class="mt-6 grid gap-4 sm:grid-cols-3">
                <div>
                    <dt class="text-xs font-bold uppercase text-skyblue-600">Lecturer</dt>
                    <dd id="detailLecturer" class="mt-1 text-base font-bold text-skyblue-900"></dd>
                </div>
                <div>
                    <dt class="text-xs font-bold uppercase text-skyblue-600">Shared with</dt>
                    <dd id="detailClasses" class="mt-1 text-base font-bold text-skyblue-900"></dd>
                </div>
                <div>
                    <dt class="text-xs font-bold uppercase text-skyblue-600">Uploaded</dt>
                    <dd id="detailDate" class="mt-1 text-base font-bold text-skyblue-900"></dd>
                </div>
            </dl>
            <button id="detailDownload" type="button" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-skyblue-500 px-5 py-3 text-base font-bold text-white shadow-md hover:bg-skyblue-400">
                <i class="fa-solid fa-download"></i> Download document
            </button>
        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        loadStudentNavbar();

        async function loadLecturerDocuments() {
            try {
                const user = await getCurrentUser();

                if (user.role !== "student") {
                    window.location.href = "login.html";
                    return;
                }

                const documents = await getLecturerDocuments();
                const container = document.getElementById("lecturerDocumentsBody");
                container.innerHTML = "";

                if (documents.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full rounded-3xl border border-skyblue-300 bg-white/90 px-6 py-16 text-center shadow-sm">
                            <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-2xl bg-skyblue-100 text-skyblue-600">
                                <i class="fa-solid fa-book-open text-3xl"></i>
                            </div>
                            <h3 class="mt-5 text-xl font-bold text-skyblue-900">
                                No lecture materials available
                            </h3>
                            <p class="mt-2 text-base text-skyblue-600">
                                Your lecturers have not uploaded any documents for your class yet.
                            </p>
                        </div>
                    `;
                    return;
                }

                window.lecturerDocuments = documents;

                documents.forEach((documentItem, documentIndex) => {
                    const card = document.createElement("article");

                    card.className = "group overflow-hidden rounded-2xl border border-skyblue-200 bg-white/90 shadow-md transition duration-300 hover:-translate-y-1 hover:border-skyblue-400 hover:shadow-xl";

                    card.innerHTML = `
                        <!-- File Preview -->
                        <div class="relative flex h-44 items-center justify-center bg-gradient-to-br from-skyblue-50 to-skyblue-100">
                            <div class="flex h-20 w-20 items-center justify-center rounded-2xl bg-white text-skyblue-500 shadow-sm transition duration-300 group-hover:scale-110">
                                <i class="fa-solid fa-file-lines text-3xl"></i>
                            </div>
                            <div class="absolute right-4 top-4 rounded-lg bg-white/80 px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-skyblue-700 backdrop-blur">
                                Lecture
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="p-6">
                            <h2 class="line-clamp-2 min-h-[56px] text-lg font-bold leading-7 text-skyblue-900" title="${escapeHtml(documentItem.file_name)}">
                                ${escapeHtml(documentItem.file_name)}
                            </h2>

                            <div class="mt-4 space-y-3 border-t border-skyblue-100 pt-4">
                                <div class="flex items-center gap-3">
                                    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-skyblue-100 text-sm text-skyblue-600">
                                        <i class="fa-solid fa-user-tie"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <p class="text-xs font-bold uppercase tracking-wider text-skyblue-600">
                                            Lecturer
                                        </p>
                                        <p class="truncate text-base font-semibold text-skyblue-900">
                                            <button type="button" onclick="showDocumentDetails(${documentIndex})" class="truncate text-left text-base font-bold text-skyblue-700 underline-offset-2 hover:underline">
                                                ${escapeHtml(documentItem.lecturer_name)}
                                            </button>
                                        </p>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2 text-sm text-skyblue-700 font-medium">
                                        <i class="fa-solid fa-users text-skyblue-500"></i>
                                        ${escapeHtml(documentItem.lecturer_class)}
                                    </div>

                                    <div class="flex items-center gap-2 text-sm text-skyblue-600">
                                        <i class="fa-regular fa-calendar"></i>
                                        ${documentItem.created_at}
                                    </div>
                                </div>
                            </div>

                            <!-- Download -->
                            <button onclick="downloadLecturerDocument(${documentItem.id}, '${escapeJs(documentItem.file_name)}')" class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-skyblue-500 px-4 py-3.5 text-base font-bold text-white transition hover:bg-skyblue-400 shadow-md">
                                <i class="fa-solid fa-download"></i>
                                Download Material
                            </button>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                document.getElementById("documentsError").textContent = error.message;
            }
        }

        async function downloadLecturerDocument(documentId, fileName) {
            try {
                await downloadDocument(documentId, fileName);
            } catch (error) {
                alert(`Download failed: ${error.message}`);
            }
        }

        function showDocumentDetails(documentIndex) {
            const documentItem = window.lecturerDocuments[documentIndex];
            if (!documentItem) return;

            document.getElementById("detailFileName").textContent = documentItem.file_name || "Document";
            document.getElementById("detailLecturer").textContent = documentItem.lecturer_name || "Unknown";
            document.getElementById("detailClasses").textContent = Array.isArray(documentItem.class_names) && documentItem.class_names.length
                ? documentItem.class_names.join(", ")
                : documentItem.lecturer_class || "Your class";
            document.getElementById("detailDate").textContent = documentItem.created_at || "Unknown";
            document.getElementById("detailDownload").onclick = () => downloadLecturerDocument(documentItem.id, documentItem.file_name);
            document.getElementById("documentDetails").classList.remove("hidden");
            document.getElementById("documentDetails").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function closeDocumentDetails() {
            document.getElementById("documentDetails").classList.add("hidden");
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeJs(value) {
            return String(value ?? "")
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'")
                .replaceAll("\n", "\\n")
                .replaceAll("\r", "\\r");
        }

        loadLecturerDocuments();
    </script>
</body>

</html>
