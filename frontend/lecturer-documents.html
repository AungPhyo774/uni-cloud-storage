<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lecturer Materials</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="min-h-screen bg-slate-50 text-slate-800">


    <!-- =====================================================
         SHARED NAVBAR
    ====================================================== -->

    <nav class="fixed left-0 right-0 top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur-xl">

        <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">


            <a
                href="student-dashboard.html"
                class="flex items-center gap-3"
            >

                <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-teal-600 text-white shadow-lg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <div class="hidden sm:block">

                    <p class="font-bold text-slate-900">
                        EduPortal
                    </p>

                    <p class="text-xs text-slate-500">
                        Student Learning System
                    </p>

                </div>

            </a>


            <div class="hidden items-center gap-1 md:flex">

                <a
                    href="student-dashboard.html"
                    class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
                >
                    <i class="fa-solid fa-house mr-2"></i>
                    Dashboard
                </a>

                <a
                    href="student-upload.html"
                    class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
                >
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i>
                    Upload
                </a>

                <a
                    href="student-documents.html"
                    class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
                >
                    <i class="fa-solid fa-folder-open mr-2"></i>
                    My Documents
                </a>

                <a
                    href="lecturer-documents.html"
                    class="rounded-xl bg-teal-50 px-4 py-2.5 text-sm font-semibold text-teal-700"
                >
                    <i class="fa-solid fa-book-open mr-2"></i>
                    Lecturer Materials
                </a>

            </div>


            <button
                type="button"
                onclick="logout()"
                class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-600"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>

        </div>

    </nav>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="mx-auto max-w-7xl px-4 pb-16 pt-28 sm:px-6 lg:px-8">


        <!-- Hero -->

        <section class="mb-8 overflow-hidden rounded-3xl bg-slate-900 px-6 py-8 text-white shadow-xl sm:px-10">

            <div class="flex flex-col gap-7 md:flex-row md:items-center md:justify-between">

                <div>

                    <div class="mb-3 flex items-center gap-2 text-sm font-semibold text-teal-300">

                        <i class="fa-solid fa-book-open"></i>

                        LEARNING MATERIALS

                    </div>

                    <h1 class="text-3xl font-bold tracking-tight">
                        Lecturer Materials
                    </h1>

                    <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-300">
                        Browse and download lecture documents shared by lecturers
                        with your class.
                    </p>

                </div>


                <div class="hidden h-28 w-28 items-center justify-center rounded-3xl bg-white/10 md:flex">

                    <i class="fa-solid fa-books text-4xl text-teal-300"></i>

                </div>

            </div>

        </section>


        <!-- Error -->

        <p
            id="documentsError"
            class="mb-5 text-sm font-medium text-red-600"
        ></p>


        <!-- =================================================
             MATERIAL GRID
        ================================================== -->

        <div
            id="lecturerDocumentsBody"
            class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"
        ></div>

        <section id="documentDetails" class="mt-8 hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-teal-600">Document details</p>
                    <h2 id="detailFileName" class="mt-1 text-xl font-bold text-slate-900"></h2>
                </div>
                <button type="button" onclick="closeDocumentDetails()" class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200" title="Close details" aria-label="Close details">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <dl class="mt-5 grid gap-4 sm:grid-cols-3">
                <div><dt class="text-xs font-semibold uppercase text-slate-400">Lecturer</dt><dd id="detailLecturer" class="mt-1 text-sm font-semibold text-slate-700"></dd></div>
                <div><dt class="text-xs font-semibold uppercase text-slate-400">Shared with</dt><dd id="detailClasses" class="mt-1 text-sm font-semibold text-slate-700"></dd></div>
                <div><dt class="text-xs font-semibold uppercase text-slate-400">Uploaded</dt><dd id="detailDate" class="mt-1 text-sm font-semibold text-slate-700"></dd></div>
            </dl>
            <button id="detailDownload" type="button" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-bold text-white hover:bg-teal-600">
                <i class="fa-solid fa-download"></i> Download document
            </button>
        </section>

    </main>


    <script src="js/api.js"></script>


    <script>

        async function loadLecturerDocuments() {

            try {

                const user =
                    await getCurrentUser();


                if (user.role !== "student") {

                    window.location.href =
                        "login.html";

                    return;
                }


                const documents =
                    await getLecturerDocuments();


                const container =
                    document.getElementById(
                        "lecturerDocumentsBody"
                    );


                container.innerHTML = "";


                if (documents.length === 0) {

                    container.innerHTML = `

                        <div class="col-span-full rounded-3xl border border-slate-200 bg-white px-6 py-16 text-center shadow-sm">

                            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">

                                <i class="fa-solid fa-book-open text-2xl"></i>

                            </div>

                            <h3 class="mt-5 font-bold text-slate-900">
                                No lecture materials available
                            </h3>

                            <p class="mt-2 text-sm text-slate-500">
                                Your lecturers have not uploaded any documents for your class yet.
                            </p>

                        </div>

                    `;

                    return;
                }


                window.lecturerDocuments = documents;

                documents.forEach(
                    (documentItem, documentIndex) => {

                        const card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "group overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:border-teal-200 hover:shadow-xl";


                        card.innerHTML = `

                            <!-- File Preview -->

                            <div class="relative flex h-40 items-center justify-center bg-gradient-to-br from-teal-50 to-cyan-50">

                                <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white text-teal-600 shadow-sm transition duration-300 group-hover:scale-110">

                                    <i class="fa-solid fa-file-lines text-2xl"></i>

                                </div>

                                <div class="absolute right-4 top-4 rounded-lg bg-white/80 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-teal-700 backdrop-blur">
                                    Lecture
                                </div>

                            </div>


                            <!-- Content -->

                            <div class="p-5">

                                <h2
                                    class="line-clamp-2 min-h-[48px] font-bold leading-6 text-slate-900"
                                    title="${escapeHtml(
                                        documentItem.file_name
                                    )}"
                                >
                                    ${escapeHtml(
                                        documentItem.file_name
                                    )}
                                </h2>


                                <div class="mt-4 space-y-3 border-t border-slate-100 pt-4">


                                    <div class="flex items-center gap-3">

                                        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-violet-50 text-xs text-violet-600">

                                            <i class="fa-solid fa-user-tie"></i>

                                        </div>

                                        <div class="min-w-0">

                                            <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                                                Lecturer
                                            </p>

                                            <p class="truncate text-sm font-semibold text-slate-700">

                                                <button type="button" onclick="showDocumentDetails(${documentIndex})" class="truncate text-left text-sm font-semibold text-teal-700 underline-offset-2 hover:underline">
                                                    ${escapeHtml(documentItem.lecturer_name)}
                                                </button>

                                            </p>

                                        </div>

                                    </div>


                                    <div class="flex items-center justify-between">

                                        <div class="flex items-center gap-2 text-xs text-slate-500">

                                            <i class="fa-solid fa-users text-slate-400"></i>

                                            ${escapeHtml(
                                                documentItem.lecturer_class
                                            )}

                                        </div>


                                        <div class="flex items-center gap-2 text-xs text-slate-400">

                                            <i class="fa-regular fa-calendar"></i>

                                            ${documentItem.created_at}

                                        </div>

                                    </div>

                                </div>


                                <!-- Download -->

                                <button
                                    onclick="downloadLecturerDocument(
                                        ${documentItem.id},
                                        '${escapeJs(
                                            documentItem.file_name
                                        )}'
                                    )"
                                    class="mt-5 flex w-full items-center justify-center gap-2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-bold text-white transition hover:bg-teal-600"
                                >

                                    <i class="fa-solid fa-download"></i>

                                    Download Material

                                </button>

                            </div>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                document.getElementById(
                    "documentsError"
                ).textContent =
                    error.message;

            }

        }


        async function downloadLecturerDocument(
            documentId,
            fileName
        ) {

            try {

                await downloadDocument(
                    documentId,
                    fileName
                );

            } catch (error) {

                alert(
                    `Download failed: ${error.message}`
                );

            }

        }

        function showDocumentDetails(documentIndex) {
            const documentItem = window.lecturerDocuments[documentIndex];
            if (!documentItem) return;

            document.getElementById("detailFileName").textContent = documentItem.file_name || "Document";
            document.getElementById("detailLecturer").textContent = documentItem.lecturer_name || "Unknown";
            document.getElementById("detailClasses").textContent = Array.isArray(documentItem.class_names) && documentItem.class_names.length
                ? documentItem.class_names.join(", ")
                : documentItem.lecturer_class || "Your class";
            document.getElementById("detailDate").textContent = documentItem.created_at || "Unknown";
            document.getElementById("detailDownload").onclick = () => downloadLecturerDocument(documentItem.id, documentItem.file_name);
            document.getElementById("documentDetails").classList.remove("hidden");
            document.getElementById("documentDetails").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function closeDocumentDetails() {
            document.getElementById("documentDetails").classList.add("hidden");
        }


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function escapeJs(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "\\",
                    "\\\\"
                )
                .replaceAll(
                    "'",
                    "\\'"
                )
                .replaceAll(
                    "\n",
                    "\\n"
                )
                .replaceAll(
                    "\r",
                    "\\r"
                );

        }


        loadLecturerDocuments();

    </script>

</body>
</html>
