<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lecturer Documents</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <h1>Lecturer Documents</h1>

    <a href="student-dashboard.html">
        Back to Dashboard
    </a>

    <br><br>

    <p id="documentsError"></p>

    <table>

        <thead>

            <tr>
                <th>File</th>
                <th>Lecturer</th>
                <th>Date</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody
            id="lecturerDocumentsBody"
        >

        </tbody>

    </table>

</div>

<script src="js/api.js"></script>

<script>

async function loadLecturerDocuments() {

    try {

        const user =
            await getCurrentUser();

        if (
            user.role !== "student"
        ) {

            window.location.href =
                "login.html";

            return;
        }


        const documents =
            await getLecturerDocuments();


        const tbody =
            document.getElementById(
                "lecturerDocumentsBody"
            );

        tbody.innerHTML = "";


        if (
            documents.length === 0
        ) {

            tbody.innerHTML =
                `
                <tr>
                    <td colspan="4">
                        No lecturer documents found.
                    </td>
                </tr>
                `;

            return;
        }


        documents.forEach(
            documentItem => {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `
                    <td>
                        ${escapeHtml(
                            documentItem.file_name
                        )}
                    </td>

                    <td>
                        ${documentItem.lecturer}
                    </td>

                    <td>
                        ${documentItem.created_at}
                    </td>

                    <td>
                        <button
                            onclick="downloadLecturerDocument(
                                ${documentItem.id},
                                '${escapeJs(
                                    documentItem.file_name
                                )}'
                            )"
                        >
                            Download
                        </button>
                    </td>
                `;


                tbody.appendChild(
                    row
                );

            }
        );

    } catch (error) {

        document.getElementById(
            "documentsError"
        ).textContent =
            error.message;

    }

}


async function downloadLecturerDocument(
    documentId,
    fileName
) {

    try {

        await downloadDocument(
            documentId,
            fileName
        );

    } catch (error) {

        alert(
            `Download failed: ${error.message}`
        );

    }

}


function escapeHtml(
    value
) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeJs(
    value
) {

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");

}


loadLecturerDocuments();

</script>

</body>
</html>
