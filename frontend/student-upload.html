<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Document</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skyblue: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#0a3751',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .glass {
            background-color: rgba(224, 242, 254, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>

<body class="min-h-screen bg-[#bae6fd]/80 text-[#0a3751]">

    <div id="studentNavbar"></div>

    <main class="mx-auto max-w-7xl px-4 pb-12 pt-28 sm:px-6 lg:px-8">

        <div class="relative mb-8 overflow-hidden rounded-3xl bg-gradient-to-r from-skyblue-700 via-skyblue-600 to-skyblue-500 p-8 text-white shadow-xl shadow-skyblue-500/20">

            <div class="relative z-10">

                <div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-skyblue-100">


                    <span>Document Submission</span>

                </div>

                <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">
                    Submit your document
                </h1>

                <p class="mt-2 max-w-2xl text-base leading-relaxed text-skyblue-100/90">
                    Choose your lecturer and upload your assignment or academic
                    document securely.
                </p>

            </div>

            <!-- Glass Icon Box Decorator -->


        </div>


        <!-- =================================================
             UPLOAD CARD
        ================================================== -->

        <div class="overflow-hidden rounded-3xl border border-skyblue-200 bg-white/90 shadow-sm backdrop-blur">


            <!-- Card Header -->

            <div class="border-b border-skyblue-100 px-6 py-6 sm:px-8">

                <div class="flex items-center gap-4">

                    <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-skyblue-100 text-skyblue-600">
                        <i class="fa-solid fa-file-arrow-up text-2xl"></i>
                    </div>

                    <div>

                        <h2 class="text-xl font-bold text-skyblue-900">
                            New Submission
                        </h2>

                        <p
                            id="studentClass"
                            class="mt-1 text-base font-medium text-skyblue-600"
                        >
                            Loading class...
                        </p>

                    </div>

                </div>

            </div>


            <!-- Form -->

            <form
                id="uploadForm"
                class="space-y-7 p-6 sm:p-8"
            >


                <!-- Lecturer -->

                <div>

                    <label
                        for="lecturer"
                        class="mb-2 block text-base font-bold text-skyblue-900"
                    >
                        Select Lecturer
                    </label>

                    <div class="relative">

                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-skyblue-500">
                            <i class="fa-solid fa-user-tie text-lg"></i>
                        </div>

                        <select
                            id="lecturer"
                            required
                            class="w-full appearance-none rounded-xl border border-skyblue-200 bg-skyblue-50/50 px-12 py-4 text-base font-medium text-skyblue-900 outline-none transition focus:border-skyblue-500 focus:bg-white focus:ring-4 focus:ring-skyblue-500/20"
                        >

                            <option value="">
                                Loading lecturers...
                            </option>

                        </select>

                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4 text-skyblue-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>

                    </div>

                </div>


                <!-- File -->

                <div>

                    <label
                        for="file"
                        class="mb-2 block text-base font-bold text-skyblue-900"
                    >
                        Select Document
                    </label>


                    <label
                        for="file"
                        class="group flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-skyblue-300 bg-skyblue-50/50 px-6 py-12 text-center transition hover:border-skyblue-500 hover:bg-skyblue-100/50"
                    >

                        <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-white text-skyblue-600 shadow-sm ring-1 ring-skyblue-200 transition group-hover:scale-105">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
                        </div>

                        <p class="text-lg font-bold text-skyblue-900">
                            Click to choose a document
                        </p>

                        <p class="mt-2 text-base text-skyblue-600">
                            PDF, DOC, DOCX or other supported files
                        </p>

                        <input
                            type="file"
                            id="file"
                            required
                            class="hidden"
                        >

                        <div
                            id="fileName"
                            class="mt-4 hidden rounded-xl bg-skyblue-100 px-5 py-2.5 text-base font-bold text-skyblue-800"
                        ></div>

                    </label>

                </div>


                <!-- Message -->

                <div
                    id="uploadMessage"
                    class="hidden rounded-xl border border-emerald-200 bg-emerald-50 px-5 py-3.5 text-base font-bold text-emerald-700"
                ></div>


                <div
                    id="uploadError"
                    class="text-base font-semibold text-red-600"
                ></div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-3 rounded-xl bg-skyblue-500 px-6 py-4 text-base font-bold text-white shadow-lg shadow-skyblue-500/25 transition hover:bg-skyblue-600 hover:shadow-xl disabled:cursor-not-allowed disabled:opacity-60"
                >

                    <i class="fa-solid fa-paper-plane text-lg"></i>

                    Submit Document

                </button>

            </form>

        </div>


        <!-- Info -->

        <div class="mt-6 flex gap-4 rounded-2xl border border-skyblue-200 bg-white/90 p-6 shadow-sm backdrop-blur">

            <i class="fa-solid fa-circle-info mt-0.5 text-xl text-skyblue-600"></i>

            <div>

                <p class="text-base font-bold text-skyblue-900">
                    Submission information
                </p>

                <p class="mt-1 text-base leading-relaxed text-skyblue-700">
                    Make sure you select the correct lecturer before submitting
                    your document.
                </p>

            </div>

        </div>

    </main>


    <script src="js/api.js?v=20260822"></script>
    <script src="js/student-navbar.js"></script>

    <script>

        loadStudentNavbar();

        async function loadUploadPage() {

            try {

                const user =
                    await getCurrentUser();


                if (user.role !== "student") {

                    window.location.href =
                        "login.html";

                    return;
                }


                document.getElementById(
                    "studentClass"
                ).textContent =
                    `Your class: ${user.class_year}`;


                const lecturers =
                    await getLecturers();


                const select =
                    document.getElementById(
                        "lecturer"
                    );


                select.innerHTML =
                    '<option value="">Select Lecturer</option>';


                lecturers.forEach(
                    lecturer => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            lecturer.id;

                        const classNames = Array.isArray(lecturer.class_names)
                            ? lecturer.class_names
                            : [lecturer.class_year].filter(Boolean);

                        option.textContent =
                            `${lecturer.full_name} (${classNames.join(", ")})`;

                        select.appendChild(
                            option
                        );

                    }
                );


            } catch (error) {

                document.getElementById(
                    "uploadError"
                ).textContent =
                    error.message;

            }

        }


        document
            .getElementById("file")
            .addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];

                    const fileName =
                        document.getElementById(
                            "fileName"
                        );

                    if (file) {

                        fileName.textContent =
                            file.name;

                        fileName.classList.remove(
                            "hidden"
                        );

                    } else {

                        fileName.classList.add(
                            "hidden"
                        );

                    }

                }
            );


        document
            .getElementById("uploadForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const lecturerId =
                        document.getElementById(
                            "lecturer"
                        ).value;


                    const file =
                        document.getElementById(
                            "file"
                        ).files[0];


                    const message =
                        document.getElementById(
                            "uploadMessage"
                        );


                    const error =
                        document.getElementById(
                            "uploadError"
                        );


                    message.textContent = "";
                    message.classList.add("hidden");

                    error.textContent = "";


                    if (!lecturerId) {

                        error.textContent =
                            "Please select a lecturer.";

                        return;
                    }


                    if (!file) {

                        error.textContent =
                            "Please select a file.";

                        return;
                    }


                    try {

                        message.textContent =
                            "Uploading...";

                        message.classList.remove(
                            "hidden"
                        );


                        const result =
                            await uploadStudentDocument(
                                lecturerId,
                                file
                            );


                        message.textContent =
                            `Upload successful: ${result.file_name}`;


                        document
                            .getElementById(
                                "uploadForm"
                            )
                            .reset();


                        document
                            .getElementById(
                                "fileName"
                            )
                            .classList.add(
                                "hidden"
                            );


                    } catch (err) {

                        message.textContent = "";

                        message.classList.add(
                            "hidden"
                        );

                        error.textContent =
                            err.message;

                    }

                }
            );


        loadUploadPage();

    </script>

</body>
</html>
