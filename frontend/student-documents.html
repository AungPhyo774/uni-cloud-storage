<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Documents</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <h1>My Documents</h1>

    <a href="student-dashboard.html">
        Back to Dashboard
    </a>

    <br><br>

    <p
        id="documentsError"
        class="error"
    ></p>

    <table>

        <thead>

            <tr>

                <th>File Name</th>
                <th>Size</th>
                <th>Created</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="documentsBody">

        </tbody>

    </table>

</div>

<script src="js/api.js"></script>

<script>

async function loadMyDocuments() {

    try {

        const user =
            await getCurrentUser();

        if (
            user.role !== "student"
        ) {

            window.location.href =
                "login.html";

            return;
        }


        const documents =
            await getMyDocuments();

        const tbody =
            document.getElementById(
                "documentsBody"
            );

        tbody.innerHTML = "";


        if (
            documents.length === 0
        ) {

            tbody.innerHTML =
                `
                <tr>
                    <td colspan="4">
                        No documents found.
                    </td>
                </tr>
                `;

            return;
        }


        documents.forEach(
            documentItem => {

                const row =
                    document.createElement(
                        "tr"
                    );


                const size =
                    formatFileSize(
                        documentItem.file_size
                    );


                row.innerHTML = `
                    <td>
                        ${escapeHtml(
                            documentItem.file_name
                        )}
                    </td>

                    <td>
                        ${size}
                    </td>

                    <td>
                        ${documentItem.created_at}
                    </td>

                    <td>

                        <button
                            onclick="downloadFile(
                                ${documentItem.id},
                                '${escapeJs(
                                    documentItem.file_name
                                )}'
                            )"
                        >
                            Download
                        </button>

                        <button
                            onclick="deleteFile(
                                ${documentItem.id}
                            )"
                        >
                            Delete
                        </button>

                    </td>
                `;

                tbody.appendChild(
                    row
                );

            }
        );

    } catch (error) {

        document.getElementById(
            "documentsError"
        ).textContent =
            error.message;

    }

}


async function downloadFile(
    documentId,
    fileName
) {

    try {

        await downloadDocument(
            documentId,
            fileName
        );

    } catch (error) {

        alert(
            `Download failed: ${error.message}`
        );

    }

}


async function deleteFile(
    documentId
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this document?"
        );

    if (!confirmed) {

        return;
    }


    try {

        await deleteDocument(
            documentId
        );

        alert(
            "Document deleted successfully."
        );

        await loadMyDocuments();

    } catch (error) {

        alert(
            `Delete failed: ${error.message}`
        );

    }

}


function formatFileSize(
    bytes
) {

    if (bytes < 1024) {

        return `${bytes} B`;

    }

    if (bytes < 1024 * 1024) {

        return `${(
            bytes / 1024
        ).toFixed(2)} KB`;

    }

    return `${(
        bytes /
        (1024 * 1024)
    ).toFixed(2)} MB`;

}


function escapeHtml(
    value
) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeJs(
    value
) {

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");

}


loadMyDocuments();

</script>

</body>
</html>
