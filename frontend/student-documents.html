<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Documents</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="min-h-screen bg-[#bae6fd]/80 text-[#0a3751]">

    <div id="studentNavbar"></div>

    <main class="mx-auto max-w-7xl px-4 pb-12 pt-28 sm:px-6 lg:px-8">

        <div class="rounded-3xl bg-gradient-to-r from-[#075985] via-[#0369a1] to-[#0284c7] p-6 text-white shadow-xl shadow-[#0c4a6e]/10 sm:p-8">

            <div class="relative z-10 flex flex-col justify-between gap-6 md:flex-row md:items-center">

                <div>

                    <div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-[#e0f2fe]">

                        <i class="fa-solid fa-folder-open"></i>

                        <span>Document Library</span>

                    </div>

                    <h1 class="text-3xl font-extrabold tracking-tight text-white md:text-4xl">
                        My Documents
                    </h1>

                    <p class="mt-2 text-sm text-[#e0f2fe]/90">
                        Manage all documents you have submitted.
                    </p>

                </div>


                <a
                    href="student-upload.html"
                    class="inline-flex items-center justify-center gap-2 rounded-2xl bg-white px-6 py-3.5 text-sm font-bold text-[#0369a1] shadow-md transition hover:bg-[#e0f2fe]"
                >
                    <i class="fa-solid fa-plus"></i>
                    Upload Document
                </a>

            </div>

            <!-- Glass Icon Box Decorator -->

            

        </div>


        <!-- Error -->

        <p
            id="documentsError"
            class="mb-5 text-sm font-medium text-red-600"
        ></p>


        <!-- =================================================
             DOCUMENT TABLE CONTAINER
        ================================================== -->

        <div class="overflow-hidden rounded-3xl border border-[#bae6fd] bg-white/95 shadow-lg backdrop-blur-md">


            <!-- Table header -->

            <div class="border-b border-[#bae6fd] bg-[#f0f9ff] px-6 py-5">

                <div class="flex items-center gap-3">

                    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#0284c7] text-white shadow-md">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>

                    <div>

                        <h2 class="font-bold text-[#0a3751]">
                            Submitted Documents
                        </h2>

                        <p class="text-xs text-[#0369a1]">
                            Your uploaded academic files
                        </p>

                    </div>

                </div>

            </div>


            <!-- Responsive table -->

            <div class="overflow-x-auto">

                <table class="w-full min-w-[900px] text-left">

                    <thead class="border-b border-[#bae6fd] bg-white">

                        <tr>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-[#0369a1]">
                                Document
                            </th>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-[#0369a1]">
                                Lecturer
                            </th>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-[#0369a1]">
                                Size
                            </th>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-[#0369a1]">
                                Date
                            </th>

                            <th class="px-6 py-4 text-right text-xs font-bold uppercase tracking-wider text-[#0369a1]">
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="documentsBody"
                        class="divide-y divide-[#e0f2fe]"
                    ></tbody>

                </table>

            </div>

        </div>

    </main>


    <script src="js/api.js"></script>
    <script src="js/student-navbar.js"></script>

    <script>
        loadStudentNavbar();
        
        async function loadMyDocuments() {

            try {

                const user =
                    await getCurrentUser();


                if (user.role !== "student") {

                    window.location.href =
                        "login.html";

                    return;
                }


                const documents =
                    await getMyDocuments();


                const tbody =
                    document.getElementById(
                        "documentsBody"
                    );


                tbody.innerHTML = "";


                if (documents.length === 0) {

                    tbody.innerHTML = `

                        <tr>

                            <td
                                colspan="6"
                                class="px-6 py-16 text-center"
                            >

                                <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-[#e0f2fe] text-[#0284c7]">

                                    <i class="fa-solid fa-folder-open text-2xl"></i>

                                </div>

                                <h3 class="mt-4 font-bold text-[#0a3751]">
                                    No documents yet
                                </h3>

                                <p class="mt-1 text-sm text-[#0369a1]">
                                    Upload your first document to see it here.
                                </p>

                            </td>

                        </tr>

                    `;

                    return;
                }


                documents.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        row.className =
                            "group transition hover:bg-[#f0f9ff]";


                        row.innerHTML = `

                            <td class="px-6 py-5">

                                <div class="flex items-center gap-4">

                                    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#e0f2fe] text-[#0284c7]">

                                        <i class="fa-solid fa-file-lines"></i>

                                    </div>

                                    <div class="min-w-0">

                                        <p class="truncate font-semibold text-[#0a3751]">

                                            ${escapeHtml(
                                                item.file_name
                                            )}

                                        </p>

                                        <p class="mt-1 text-xs text-[#0369a1]">
                                            Submitted document
                                        </p>

                                    </div>

                                </div>

                            </td>


                            <td class="px-6 py-5">

                                <div class="flex items-center gap-2">

                                    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-[#e0f2fe] text-xs text-[#0284c7]">

                                        <i class="fa-solid fa-user-tie"></i>

                                    </div>

                                    <span class="text-sm font-medium text-[#0c4a6e]">

                                        ${escapeHtml(
                                            item.lecturer_name
                                        )}

                                    </span>

                                </div>

                            </td>

                            <td class="px-6 py-5 text-sm text-[#075985]">

                                ${formatFileSize(
                                    item.file_size
                                )}

                            </td>


                            <td class="px-6 py-5 text-sm text-[#0369a1]">

                                ${item.created_at}

                            </td>


                            <td class="px-6 py-5">

                                <div class="flex justify-end gap-2">

                                    <button
                                        onclick="downloadMyFile(
                                            ${item.id},
                                            '${escapeJs(
                                                item.file_name
                                            )}'
                                        )"
                                        class="flex h-9 w-9 items-center justify-center rounded-lg border border-[#bae6fd] bg-white text-[#0369a1] transition hover:border-[#0284c7] hover:bg-[#0284c7] hover:text-white"
                                        title="Download"
                                    >
                                        <i class="fa-solid fa-download text-xs"></i>
                                    </button>


                                    <button
                                        onclick="deleteMyFile(
                                            ${item.id}
                                        )"
                                        class="flex h-9 w-9 items-center justify-center rounded-lg border border-[#bae6fd] bg-white text-[#0369a1] transition hover:border-red-200 hover:bg-red-50 hover:text-red-600"
                                        title="Delete"
                                    >
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>

                                </div>

                            </td>

                        `;


                        tbody.appendChild(
                            row
                        );

                    }
                );


            } catch (error) {

                document.getElementById(
                    "documentsError"
                ).textContent =
                    error.message;

            }

        }


        async function downloadMyFile(
            documentId,
            fileName
        ) {

            try {

                await downloadDocument(
                    documentId,
                    fileName
                );

            } catch (error) {

                alert(
                    `Download failed: ${error.message}`
                );

            }

        }


        async function deleteMyFile(
            documentId
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this document?"
                );


            if (!confirmed) {

                return;

            }


            try {

                await deleteDocument(
                    documentId
                );


                alert(
                    "Document deleted successfully."
                );


                await loadMyDocuments();


            } catch (error) {

                alert(
                    `Delete failed: ${error.message}`
                );

            }

        }


        function formatFileSize(
            bytes
        ) {

            if (bytes < 1024) {

                return `${bytes} B`;

            }


            if (
                bytes <
                1024 * 1024
            ) {

                return `${(
                    bytes / 1024
                ).toFixed(2)} KB`;

            }


            return `${(
                bytes /
                (1024 * 1024)
            ).toFixed(2)} MB`;

        }


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function escapeJs(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "\\",
                    "\\\\"
                )
                .replaceAll(
                    "'",
                    "\\'"
                )
                .replaceAll(
                    "\n",
                    "\\n"
                )
                .replaceAll(
                    "\r",
                    "\\r"
                );

        }


        loadMyDocuments();

    </script>

</body>
</html>
