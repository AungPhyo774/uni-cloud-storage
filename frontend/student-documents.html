<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Documents</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="min-h-screen bg-slate-50 text-slate-800">


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="fixed left-0 right-0 top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur-xl">

        <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

            <a
                href="student-dashboard.html"
                class="flex items-center gap-3"
            >

                <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-teal-600 text-white shadow-lg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <div class="hidden sm:block">

                    <p class="font-bold text-slate-900">
                        EduPortal
                    </p>

                    <p class="text-xs text-slate-500">
                        Student Learning System
                    </p>

                </div>

            </a>


            <div class="hidden items-center gap-1 md:flex">

                <a
                    href="student-dashboard.html"
                    class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
                >
                    <i class="fa-solid fa-house mr-2"></i>
                    Dashboard
                </a>

                <a
                    href="student-upload.html"
                    class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
                >
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i>
                    Upload
                </a>

                <a
                    href="student-documents.html"
                    class="rounded-xl bg-teal-50 px-4 py-2.5 text-sm font-semibold text-teal-700"
                >
                    <i class="fa-solid fa-folder-open mr-2"></i>
                    My Documents
                </a>

                <a
                    href="lecturer-documents.html"
                    class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
                >
                    <i class="fa-solid fa-book-open mr-2"></i>
                    Lecturer Materials
                </a>

            </div>


            <button
                type="button"
                onclick="logout()"
                class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-500 hover:border-red-200 hover:bg-red-50 hover:text-red-600"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>

        </div>

    </nav>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="mx-auto max-w-7xl px-4 pb-16 pt-28 sm:px-6 lg:px-8">


        <!-- Header -->

        <div class="mb-8 flex flex-col justify-between gap-5 md:flex-row md:items-end">

            <div>

                <div class="mb-2 flex items-center gap-2 text-sm font-semibold text-teal-600">

                    <i class="fa-solid fa-folder-open"></i>

                    DOCUMENT LIBRARY

                </div>

                <h1 class="text-3xl font-bold tracking-tight text-slate-900">
                    My Documents
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    Manage all documents you have submitted.
                </p>

            </div>


            <a
                href="student-upload.html"
                class="inline-flex items-center justify-center gap-2 rounded-xl bg-teal-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-teal-600/20 transition hover:bg-teal-700"
            >
                <i class="fa-solid fa-plus"></i>
                Upload Document
            </a>

        </div>


        <!-- Error -->

        <p
            id="documentsError"
            class="mb-5 text-sm font-medium text-red-600"
        ></p>


        <!-- =================================================
             DOCUMENT TABLE
        ================================================== -->

        <div class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">


            <!-- Table header -->

            <div class="border-b border-slate-100 bg-slate-50/70 px-6 py-5">

                <div class="flex items-center gap-3">

                    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-teal-600 shadow-sm">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>

                    <div>

                        <h2 class="font-bold text-slate-900">
                            Submitted Documents
                        </h2>

                        <p class="text-xs text-slate-500">
                            Your uploaded academic files
                        </p>

                    </div>

                </div>

            </div>


            <!-- Responsive table -->

            <div class="overflow-x-auto">

                <table class="w-full min-w-[900px] text-left">

                    <thead class="border-b border-slate-100 bg-white">

                        <tr>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                                Document
                            </th>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                                Lecturer
                            </th>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                                Class
                            </th>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                                Size
                            </th>

                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                                Date
                            </th>

                            <th class="px-6 py-4 text-right text-xs font-bold uppercase tracking-wider text-slate-400">
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="documentsBody"
                        class="divide-y divide-slate-100"
                    ></tbody>

                </table>

            </div>

        </div>

    </main>


    <script src="js/api.js"></script>


    <script>

        async function loadMyDocuments() {

            try {

                const user =
                    await getCurrentUser();


                if (user.role !== "student") {

                    window.location.href =
                        "login.html";

                    return;
                }


                const documents =
                    await getMyDocuments();


                const tbody =
                    document.getElementById(
                        "documentsBody"
                    );


                tbody.innerHTML = "";


                if (documents.length === 0) {

                    tbody.innerHTML = `

                        <tr>

                            <td
                                colspan="6"
                                class="px-6 py-16 text-center"
                            >

                                <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">

                                    <i class="fa-solid fa-folder-open text-2xl"></i>

                                </div>

                                <h3 class="mt-4 font-bold text-slate-800">
                                    No documents yet
                                </h3>

                                <p class="mt-1 text-sm text-slate-500">
                                    Upload your first document to see it here.
                                </p>

                            </td>

                        </tr>

                    `;

                    return;
                }


                documents.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        row.className =
                            "group transition hover:bg-slate-50";


                        row.innerHTML = `

                            <td class="px-6 py-5">

                                <div class="flex items-center gap-4">

                                    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-teal-50 text-teal-600">

                                        <i class="fa-solid fa-file-lines"></i>

                                    </div>

                                    <div class="min-w-0">

                                        <p class="truncate font-semibold text-slate-800">

                                            ${escapeHtml(
                                                item.file_name
                                            )}

                                        </p>

                                        <p class="mt-1 text-xs text-slate-400">
                                            Submitted document
                                        </p>

                                    </div>

                                </div>

                            </td>


                            <td class="px-6 py-5">

                                <div class="flex items-center gap-2">

                                    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-violet-50 text-xs text-violet-600">

                                        <i class="fa-solid fa-user-tie"></i>

                                    </div>

                                    <span class="text-sm font-medium text-slate-700">

                                        ${escapeHtml(
                                            item.lecturer_name
                                        )}

                                    </span>

                                </div>

                            </td>


                            <td class="px-6 py-5">

                                <span class="rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">

                                    ${escapeHtml(
                                        item.lecturer_class
                                    )}

                                </span>

                            </td>


                            <td class="px-6 py-5 text-sm text-slate-600">

                                ${formatFileSize(
                                    item.file_size
                                )}

                            </td>


                            <td class="px-6 py-5 text-sm text-slate-500">

                                ${item.created_at}

                            </td>


                            <td class="px-6 py-5">

                                <div class="flex justify-end gap-2">

                                    <button
                                        onclick="downloadMyFile(
                                            ${item.id},
                                            '${escapeJs(
                                                item.file_name
                                            )}'
                                        )"
                                        class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 text-slate-500 transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-600"
                                        title="Download"
                                    >
                                        <i class="fa-solid fa-download text-xs"></i>
                                    </button>


                                    <button
                                        onclick="deleteMyFile(
                                            ${item.id}
                                        )"
                                        class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-600"
                                        title="Delete"
                                    >
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>

                                </div>

                            </td>

                        `;


                        tbody.appendChild(
                            row
                        );

                    }
                );


            } catch (error) {

                document.getElementById(
                    "documentsError"
                ).textContent =
                    error.message;

            }

        }


        async function downloadMyFile(
            documentId,
            fileName
        ) {

            try {

                await downloadDocument(
                    documentId,
                    fileName
                );

            } catch (error) {

                alert(
                    `Download failed: ${error.message}`
                );

            }

        }


        async function deleteMyFile(
            documentId
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this document?"
                );


            if (!confirmed) {

                return;

            }


            try {

                await deleteDocument(
                    documentId
                );


                alert(
                    "Document deleted successfully."
                );


                await loadMyDocuments();


            } catch (error) {

                alert(
                    `Delete failed: ${error.message}`
                );

            }

        }


        function formatFileSize(
            bytes
        ) {

            if (bytes < 1024) {

                return `${bytes} B`;

            }


            if (
                bytes <
                1024 * 1024
            ) {

                return `${(
                    bytes / 1024
                ).toFixed(2)} KB`;

            }


            return `${(
                bytes /
                (1024 * 1024)
            ).toFixed(2)} MB`;

        }


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function escapeJs(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "\\",
                    "\\\\"
                )
                .replaceAll(
                    "'",
                    "\\'"
                )
                .replaceAll(
                    "\n",
                    "\\n"
                )
                .replaceAll(
                    "\r",
                    "\\r"
                );

        }


        loadMyDocuments();

    </script>

</body>
</html>
