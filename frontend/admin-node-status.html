<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Node Status</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <h1>Storage Node Status</h1>

    <a href="admin-dashboard.html">
        Back to Dashboard
    </a>

    <br><br>


    <button
        onclick="loadNodeStatus()"
    >
        Refresh
    </button>


    <div
        id="nodesContainer"
    >

        Loading...

    </div>


    <h2>Replication Status</h2>


    <table>

        <thead>

            <tr>

                <th>Document</th>

                <th>Primary</th>

                <th>Replica</th>

                <th>Status</th>

            </tr>

        </thead>


        <tbody
            id="replicationBody"
        ></tbody>

    </table>


    <p
        id="nodeError"
        class="error"
    ></p>

</div>


<script src="js/api.js"></script>

<script>

async function loadNodeStatus() {

    try {

        const user =
            await getCurrentUser();


        if (
            user.role !== "admin"
        ) {

            window.location.href =
                "login.html";

            return;
        }


        // =========================================
        // NODE HEALTH
        // =========================================

        const health =
            await getNodeHealth();


        const nodeContainer =
            document.getElementById(
                "nodesContainer"
            );


        nodeContainer.innerHTML = "";


        health.nodes.forEach(
            node => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.innerHTML = `

                    <h3>
                        ${
                            node.status ===
                            "online"
                                ? "🟢"
                                : "🔴"
                        }

                        ${node.name}
                    </h3>

                    <p>
                        ${node.url}
                    </p>

                    <p>
                        Status:
                        ${node.status}
                    </p>

                `;


                nodeContainer.appendChild(
                    div
                );

            }
        );


        // =========================================
        // REPLICATION
        // =========================================

        const replication =
            await getReplicationStatus();


        const tbody =
            document.getElementById(
                "replicationBody"
            );


        tbody.innerHTML = "";


        const documents =
            replication.documents || [];


        documents.forEach(
            item => {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${escapeHtml(
                            item.file_name
                        )}
                    </td>

                    <td>
                        ${item.primary_node}
                    </td>

                    <td>
                        ${item.replica_node}
                    </td>

                    <td>
                        ${item.status}
                    </td>

                `;


                tbody.appendChild(
                    row
                );

            }
        );

    } catch (error) {

        document.getElementById(
            "nodeError"
        ).textContent =
            error.message;

    }

}


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


loadNodeStatus();

</script>

</body>
</html>
