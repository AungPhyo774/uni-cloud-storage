<form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p id="loginError"></p>

<script src="js/api.js"></script>
<script>
document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document.getElementById(
                    "email"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            const errorElement =
                document.getElementById(
                    "loginError"
                );

            try {

                await loginUser(
                    email,
                    password
                );

                const user =await getCurrentUser();

                if (user.role === "admin") {

                    window.location.href ="admin-dashboard.html";

                } else if (user.role === "lecturer") {

                    window.location.href ="lecturer-dashboard.html";
                } else {
                    
                    window.location.href ="student-dashboard.html";
                }
                
            } catch (error) {

                errorElement.textContent =

                error.message;
            }
        }
    );
</script>
