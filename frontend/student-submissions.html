<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Submissions</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <h1>Student Submissions</h1>

    <a href="lecturer-dashboard.html">
        Back to Dashboard
    </a>

    <br><br>


    <p id="classInfo"></p>

    <p
        id="submissionsError"
        class="error"
    ></p>


    <table>

        <thead>

            <tr>

                <th>File Name</th>

                <th>Student</th>

                <th>Size</th>

                <th>Date</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody
            id="submissionsBody"
        >

        </tbody>

    </table>

</div>


<script src="js/api.js"></script>

<script>

async function loadStudentSubmissions() {

    try {

        const user =
            await getCurrentUser();


        // -----------------------------------------
        // Role check
        // -----------------------------------------

        if (
            user.role !== "lecturer"
        ) {

            window.location.href =
                "login.html";

            return;
        }


        document.getElementById(
            "classInfo"
        ).textContent =
            `Class: ${user.class_year}`;


        // -----------------------------------------
        // Get student submissions
        // -----------------------------------------

        const documents =
            await getStudentSubmissions();


        const tbody =
            document.getElementById(
                "submissionsBody"
            );


        tbody.innerHTML = "";


        if (
            documents.length === 0
        ) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5">
                        No student submissions found.
                    </td>
                </tr>
            `;

            return;
        }


        documents.forEach(
            item => {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${escapeHtml(
                            item.file_name
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.student_name
                        )}
                    </td>

                    <td>
                        ${formatFileSize(
                            item.file_size
                        )}
                    </td>

                    <td>
                        ${item.created_at}
                    </td>

                    <td>

                        <button
                            onclick="downloadSubmission(
                                ${item.id},
                                '${escapeJs(
                                    item.file_name
                                )}'
                            )"
                        >
                            Download
                        </button>

                    </td>

                `;


                tbody.appendChild(
                    row
                );

            }
        );

    } catch (error) {

        document.getElementById(
            "submissionsError"
        ).textContent =
            error.message;

    }

}


async function downloadSubmission(
    documentId,
    fileName
) {

    try {

        await downloadDocument(
            documentId,
            fileName
        );

    } catch (error) {

        alert(
            `Download failed: ${error.message}`
        );

    }

}


function formatFileSize(bytes) {

    if (bytes < 1024) {

        return `${bytes} B`;

    }

    if (bytes < 1024 * 1024) {

        return `${(
            bytes / 1024
        ).toFixed(2)} KB`;

    }

    return `${(
        bytes /
        (1024 * 1024)
    ).toFixed(2)} MB`;

}


function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeJs(value) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );

}


loadStudentSubmissions();

</script>

</body>
</html>
