<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Teaching Classes</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 min-h-screen">


<div class="max-w-4xl mx-auto p-6">

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm">

        <div class="p-6 border-b">

            <h1 class="text-2xl font-bold">
                My Teaching Classes
            </h1>

            <p class="text-sm text-slate-500 mt-1">
                Select the classes you currently teach.
            </p>

        </div>


        <div class="p-6">

            <div
                id="classesContainer"
                class="grid grid-cols-1 md:grid-cols-2 gap-4"
            >
                Loading...
            </div>


            <p
                id="classMessage"
                class="hidden mt-5 p-4 rounded-xl text-sm"
            ></p>


            <div class="flex justify-between mt-7">

                <a
                    href="lecturer-dashboard.html"
                    class="px-4 py-2.5 rounded-xl border"
                >
                    Back
                </a>

                <a
                    href="lecturer-upload.html"
                    class="px-5 py-2.5 rounded-xl bg-gold-500 text-white font-semibold"
                >
                    Upload Document
                </a>

                <button
                    id="saveClassesButton"
                    type="button"
                    class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-semibold"
                >
                    Save Classes
                </button>

            </div>

        </div>

    </div>

</div>


<script src="js/api.js?v=20260822"></script>
<script src="js/lecturer-classes.js?v=20260822"></script>

</body>

</html>
