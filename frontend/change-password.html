<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <main class="mx-auto flex min-h-screen max-w-lg items-center px-4 py-10">
        <section class="w-full rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <a id="backLink" href="student-dashboard.html" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-teal-600">
                <i class="fa-solid fa-arrow-left"></i> Back to dashboard
            </a>
            <div class="mt-8 flex h-12 w-12 items-center justify-center rounded-xl bg-slate-100 text-slate-700">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="mt-5 text-2xl font-bold text-slate-900">Change password</h1>
            <p class="mt-2 text-sm text-slate-500">Update your account password securely.</p>
            <form id="passwordForm" class="mt-7 space-y-5">
                <label class="block text-sm font-semibold text-slate-700">Current password
                    <input id="oldPassword" type="password" required autocomplete="current-password" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-teal-500 focus:bg-white">
                </label>
                <label class="block text-sm font-semibold text-slate-700">New password
                    <input id="newPassword" type="password" required minlength="6" autocomplete="new-password" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-teal-500 focus:bg-white">
                </label>
                <label class="block text-sm font-semibold text-slate-700">Confirm new password
                    <input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-teal-500 focus:bg-white">
                </label>
                <p id="passwordMessage" class="hidden rounded-xl px-4 py-3 text-sm"></p>
                <button id="changePasswordButton" type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-teal-600 px-4 py-3.5 font-semibold text-white hover:bg-teal-700 disabled:cursor-not-allowed disabled:opacity-60">
                    <i class="fa-solid fa-lock"></i> Change password
                </button>
            </form>
        </section>
    </main>
    <script src="js/api.js?v=20260822"></script>
    <script>
        const form = document.getElementById("passwordForm");
        const button = document.getElementById("changePasswordButton");
        const message = document.getElementById("passwordMessage");

        async function initializePage() {
            try {
                const user = await getCurrentUser();
                if (!user || !["student", "lecturer"].includes(user.role)) {
                    window.location.href = "login.html";
                    return;
                }
                document.getElementById("backLink").href = user.role === "lecturer"
                    ? "lecturer-dashboard.html"
                    : "student-dashboard.html";
            } catch (error) {
                window.location.href = "login.html";
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            message.className = "hidden";

            if (newPassword !== confirmPassword) {
                showMessage("New passwords do not match.", false);
                return;
            }

            try {
                button.disabled = true;
                button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';
                const result = await changeMyPassword(oldPassword, newPassword, confirmPassword);
                showMessage(result.message, true);
                form.reset();
            } catch (error) {
                showMessage(error.message, false);
            } finally {
                button.disabled = false;
                button.innerHTML = '<i class="fa-solid fa-lock"></i> Change password';
            }
        });

        function showMessage(text, success) {
            message.textContent = text;
            message.className = success
                ? "rounded-xl bg-emerald-50 px-4 py-3 text-sm text-emerald-700"
                : "rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700";
        }

        initializePage();
    </script>
</body>
</html>
